<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Órbita Spanish</title>
<meta name="theme-color" content="#150a18">
<meta name="description" content="Spanish lessons that show how every word sounds, in English letters.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Órbita">
<style>
@font-face{font-family:'Unbounded';src:url('fonts/unbounded.woff2') format('woff2');font-weight:200 900;font-style:normal;font-display:swap}
@font-face{font-family:'Hanken Grotesk';src:url('fonts/hanken-grotesk.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Martian Mono';src:url('fonts/martian-mono.woff2') format('woff2');font-weight:100 800;font-style:normal;font-display:swap}
:root{
  /* Layout: one phone-width column. A living sun-orb is the only loud element; everything else sits quiet on night plum. */
  --night:#150a18; --plum:#231128; --plum-2:#321a39; --line:rgba(255,220,180,.14);
  --ink:#fff4e6; --mute:#c7a8bb;
  --sol:#ffb21e; --rosa:#ff2e93; --agua:#1fd6c8; --brasa:#ff6a3d;
  --display:'Unbounded',system-ui,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Martian Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.9,.25,1.15);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--sol);outline-offset:3px}
input{font:inherit;color:inherit}

/* ambient sky */
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sky i{position:absolute;border-radius:50%;will-change:transform}
.sky i:nth-child(1){width:90vmax;height:90vmax;left:-40vmax;top:-45vmax;background:radial-gradient(circle,rgba(160,24,104,.55),transparent 62%);animation:drift1 24s ease-in-out infinite alternate}
.sky i:nth-child(2){width:80vmax;height:80vmax;right:-38vmax;bottom:-40vmax;background:radial-gradient(circle,rgba(190,84,20,.42),transparent 62%);animation:drift2 30s ease-in-out infinite alternate}
.sky i:nth-child(3){width:46vmax;height:46vmax;left:30%;top:42%;background:radial-gradient(circle,rgba(31,214,200,.13),transparent 62%);animation:drift1 36s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vmax,-9vmax) scale(1.1)}}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 8px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.22em}
.brand b{color:var(--sol);font-weight:800}
.stats{display:flex;gap:8px;align-items:center}
.stat{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat svg{width:14px;height:14px}
.stat.pop{animation:pop .5s var(--ease)}
.stat.flame svg{color:var(--brasa)} .stat.xp svg{color:var(--sol)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mute);transition:transform .15s,color .2s}
.icon-btn:active{transform:scale(.9)} .icon-btn svg{width:16px;height:16px}
.icon-btn.off{opacity:.45}

#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 18px 28px;scroll-behavior:smooth}
.view{display:flex;flex-direction:column;gap:22px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

.tabs{position:relative;display:grid;grid-template-columns:repeat(var(--tabs,4),1fr);padding:6px 10px 10px;border-top:1px solid var(--line);background:rgba(21,10,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--mute);transition:color .25s}
.tabs button svg{width:22px;height:22px;transition:transform .35s var(--ease)}
.tabs button[aria-current="page"]{color:var(--sol)}
.tabs button[aria-current="page"] svg{transform:translateY(-2px) scale(1.12)}
.tab-glow{position:absolute;top:-1px;left:10px;width:calc((100% - 20px)/var(--tabs,4));height:2px;pointer-events:none;transition:transform .45s var(--ease)}
.tab-glow::after{content:"";position:absolute;left:28%;right:28%;top:0;height:2px;border-radius:2px;background:var(--sol);box-shadow:0 0 14px 2px var(--sol)}

/* shared pieces */
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance}
.en{color:var(--mute)}
.ph{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--mono);font-size:14px;line-height:1.5}
.ph .w{display:inline-flex;align-items:baseline;white-space:nowrap}
.ph .syl{color:var(--mute);transition:color .15s,text-shadow .15s,transform .15s;display:inline-block}
.ph .syl.on{color:var(--sol);font-weight:600}
.ph .syl.lit{color:#fff;text-shadow:0 0 12px var(--sol);transform:translateY(-2px)}
.ph .dash{color:rgba(199,168,187,.5);padding:0 1px}
.ph.big{font-size:19px;gap:4px 14px}
.ph.sm{font-size:12px}
.say{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--night);background:linear-gradient(135deg,var(--sol),var(--brasa));box-shadow:0 6px 20px -6px var(--brasa);transition:transform .2s var(--ease)}
.say:active{transform:scale(.88)} .say svg{width:20px;height:20px}
.say.ghost{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:none;border:1px solid var(--line);width:auto;padding:0 14px;font-size:13px;font-weight:600}
.no-audio .say,.no-audio .needs-audio{display:none!important}
.btn{position:relative;overflow:hidden;display:block;width:100%;padding:16px 20px;border-radius:18px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-align:center;transition:transform .18s var(--ease),opacity .2s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{color:var(--night);background:linear-gradient(100deg,var(--sol),var(--brasa) 70%,var(--rosa) 130%);box-shadow:0 10px 30px -10px var(--brasa)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,55%{left:-60%}100%{left:130%}}
.btn.quiet{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.btn[disabled]{opacity:.35;filter:saturate(.3);pointer-events:none}
.btn[disabled]::after{display:none}
.btn.sm{padding:13px 12px;font-size:12px}
.row2{display:flex;gap:10px}
.row2>.btn{flex:1}
.install{display:grid;gap:10px}
.install p{font-size:14px;color:var(--mute)}
.card{background:linear-gradient(180deg,rgba(50,26,57,.75),rgba(35,17,40,.75));border:1px solid var(--line);border-radius:22px;padding:18px}
.field{width:100%;padding:15px 16px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-size:17px;transition:border-color .2s,box-shadow .2s}
.field:focus{outline:none;border-color:var(--sol);box-shadow:0 0 0 4px rgba(255,178,30,.14)}
.field::placeholder{color:rgba(199,168,187,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mute);transition:all .2s}
.chip[aria-pressed="true"]{color:var(--night);background:var(--sol);border-color:var(--sol)}
.chip:active{transform:scale(.95)}

/* hero */
.hero{position:relative;min-height:284px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding-bottom:6px}
.orb-btn{position:absolute;right:-58px;top:-14px;width:320px;height:320px;border-radius:50%}
.hero>*:not(.orb-btn){pointer-events:none}
.orb-btn:active canvas{transform:scale(.97)}
canvas.orb{display:block;width:100%;height:100%;transition:transform .2s var(--ease)}
.hero .es{position:relative;font-size:clamp(30px,11vw,46px);max-width:58%;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(21,10,24,.9)}
.hero .es.long{font-size:clamp(22px,7.4vw,30px)}
.hero .ph,.hero .en,.hero .eyebrow{position:relative}
.hero .en{font-size:15px}
.swap{animation:swap .5s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(12px) scale(.96);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.meter{display:flex;flex-direction:column;gap:8px}
.meter-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--rosa),var(--brasa),var(--sol));background-size:200% 100%;animation:flow 2.4s linear infinite;transition:width .7s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px rgba(255,178,30,.5)}
@keyframes flow{to{background-position:-200% 0}}

/* path */
.unit{display:flex;flex-direction:column;gap:6px}
.unit-head{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(255,46,147,.12),rgba(255,178,30,.06) 60%,transparent)}
.unit-n{font-family:var(--display);font-weight:800;font-size:26px;color:transparent;-webkit-text-stroke:1.2px var(--sol);line-height:1}
.unit-head h2{font-size:18px}
.unit-head .en{font-size:14px}
.track{position:relative;width:280px;margin:14px auto 4px}
.track svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.track path{fill:none;stroke:rgba(255,178,30,.5);stroke-width:3;stroke-linecap:round;stroke-dasharray:2 12;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.node-row{position:relative;height:108px;display:flex;justify-content:center}
.node{position:relative;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;background:var(--plum-2);border:2px solid rgba(255,220,180,.28);box-shadow:0 8px 0 -2px rgba(0,0,0,.35);transition:transform .2s var(--ease);animation:pop .6s var(--ease) backwards;animation-delay:calc(var(--i)*40ms)}
.node:active{transform:scale(.9) translateY(3px)}
.node svg{width:26px;height:26px}
.node.done{background:linear-gradient(140deg,var(--sol),var(--brasa));color:var(--night);border-color:#ffe2a3}
.node.next{background:linear-gradient(140deg,var(--rosa),var(--brasa) 60%,var(--sol));color:#fff;border-color:#fff}
.node.next::before,.node.next::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--sol);animation:ring 2.2s ease-out infinite}
.node.next::after{animation-delay:1.1s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.75);opacity:0}}
.node-label{position:absolute;top:76px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--mute)}
.node.next + .node-label{color:var(--ink)}

/* lesson */
#lesson{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 80% -10%,rgba(160,24,104,.4),transparent 60%),var(--night);animation:rise .4s ease both}
.l-top{display:flex;align-items:center;gap:12px;padding:12px 14px 4px 16px}
.l-top .bar{flex:1;height:12px}
.l-orb{width:78px;height:78px;flex:none;margin:-12px -10px -12px -6px}
.l-body{flex:1;min-height:0;overflow-y:auto;padding:10px 20px 20px}
.step{display:flex;flex-direction:column;gap:18px;animation:stepin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes stepin{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
.prompt{display:flex;gap:14px;align-items:center}
.prompt .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.prompt h1{font-size:clamp(24px,8vw,34px);overflow-wrap:anywhere}
.prompt h1.long{font-size:clamp(19px,6vw,24px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:15px 16px;border-radius:18px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);font-size:17px;font-weight:600;transition:transform .18s var(--ease),border-color .2s,background .2s,box-shadow .2s;animation:rise .4s ease backwards;animation-delay:calc(var(--i)*55ms)}
.opt.mono{font-family:var(--mono);font-size:15px;font-weight:600}
.opt:active{transform:scale(.97)}
.opt[aria-pressed="true"]{border-color:var(--sol);background:rgba(255,178,30,.12);box-shadow:0 0 0 4px rgba(255,178,30,.1)}
.opt.right{border-color:var(--agua);background:rgba(31,214,200,.14);animation:pop .45s var(--ease)}
.opt.wrong{border-color:var(--rosa);background:rgba(255,46,147,.13);animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.locked .opt,.locked .tile,.locked .field,.locked .keys{pointer-events:none}
.trap{display:grid;gap:8px;padding:14px 16px;border-radius:18px;background:rgba(0,0,0,.25);border:1px dashed rgba(255,220,180,.25);font-size:14px}
.trap .row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.trap .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);min-width:92px}
.trap .bad{font-family:var(--mono);color:var(--rosa);text-decoration:line-through;text-decoration-thickness:1.5px}
.trap .good{font-family:var(--mono);color:var(--agua);font-weight:600}
.note{font-size:14px;color:var(--mute);border-left:2px solid var(--sol);padding-left:12px}
.listen-big{width:120px;height:120px;border-radius:50%;margin:6px auto;display:grid;place-items:center;color:var(--night);background:radial-gradient(circle at 35% 30%,#ffe9b0,var(--sol) 40%,var(--brasa) 75%,var(--rosa));box-shadow:0 0 0 10px rgba(255,178,30,.08),0 0 50px -6px var(--brasa);animation:breathe 2.6s ease-in-out infinite}
.listen-big svg{width:44px;height:44px}
@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 0 0 18px rgba(255,178,30,.05),0 0 70px -4px var(--brasa)}}
.link{font-size:13px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;align-self:center}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{min-width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:600}
.keys button:active{transform:scale(.9);background:var(--sol);color:var(--night)}
.slots{min-height:62px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0 12px;border-bottom:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:11px 14px;border-radius:14px;background:var(--plum-2);border:1.5px solid rgba(255,220,180,.25);font-weight:600;box-shadow:0 4px 0 -1px rgba(0,0,0,.4);animation:pop .35s var(--ease) backwards;transition:transform .15s}
.tile:active{transform:scale(.92)}
.tile.used{opacity:.18;pointer-events:none;box-shadow:none}
.l-foot{padding:10px 20px 18px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 20px 18px;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:12px;transform:translateY(105%);transition:transform .5s var(--ease);background:var(--plum);border-top:2px solid var(--agua);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.up{transform:none}
.sheet.bad{border-top-color:var(--rosa)}
.sheet h3{font-size:19px;color:var(--agua)}
.sheet.bad h3{color:var(--rosa)}
.sheet .ans{display:flex;gap:12px;align-items:center}
.sheet .ans b{font-size:18px}
.sheet .why{font-size:14px;color:var(--ink)}
.sheet.bad .btn.primary{background:linear-gradient(100deg,var(--rosa),var(--brasa))}
.done-orb{width:230px;height:230px;margin:-10px auto -20px}
.done h1{font-size:26px;text-align:center}
.done .ph{justify-content:center}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio div{padding:14px 8px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid var(--line);text-align:center}
.trio b{display:block;font-family:var(--display);font-size:22px;color:var(--sol);font-variant-numeric:tabular-nums}
.trio span{font-size:12px;color:var(--mute)}
.wordlist{display:flex;flex-direction:column;gap:2px}
.wordrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.wordrow b{font-size:16px}
.wordrow .en{font-size:13px;text-align:right;flex:none;max-width:42%}

/* sounds */
.lab{display:flex;flex-direction:column;gap:14px}
.lab-out{display:flex;gap:14px;align-items:center;min-height:52px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start}
.rule .glyph{grid-row:span 3;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;min-width:64px;color:transparent;-webkit-text-stroke:1.3px var(--sol)}
.rule h3{font-size:15px;font-family:var(--body);font-weight:700}
.rule p{font-size:14px;color:var(--mute)}
.ex{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.exb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-weight:700;font-size:15px;transition:transform .18s var(--ease),border-color .2s}
.exb:active{transform:scale(.94);border-color:var(--sol)}

/* review */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.day{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:10px 1fr;gap:4px 12px;padding:13px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--agua);box-shadow:0 0 10px var(--agua)}
.dot.bad{background:var(--rosa);box-shadow:0 0 10px var(--rosa)}
.hrow .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.hrow b{font-size:16px}
.hrow .you{font-size:13px;color:var(--rosa)}
.hrow .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.sync{font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--agua);box-shadow:0 0 8px var(--agua);flex:none}
.sync.local i{background:var(--sol);box-shadow:0 0 8px var(--sol)}
.empty{font-size:15px;color:var(--mute);max-width:36ch}

/* ask */
.ask-head{position:relative;display:flex;align-items:center;gap:6px;min-height:150px}
.ask-orb{width:190px;height:190px;flex:none;margin:-20px -34px -20px -44px}
.ask-head h1{font-size:clamp(22px,7vw,28px)}
.thread{display:flex;flex-direction:column;gap:12px}
.msg{padding:14px 16px;border-radius:20px;font-size:15.5px;line-height:1.6;animation:rise .4s ease both;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;max-width:86%;background:linear-gradient(120deg,rgba(255,46,147,.28),rgba(255,106,61,.22));border:1px solid rgba(255,46,147,.35);border-bottom-right-radius:6px}
.msg.orb-says{background:rgba(255,255,255,.05);border:1px solid var(--line);border-bottom-left-radius:6px}

<script>
/* Sound-it-out engine: Spanish spelling -> English-style respelling (Latin American). */
const PH = (() => {
  const VOW = 'aeiouáéíóúü';
  const ACC = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ü': 'u' };
  const FUNC = new Set(['el', 'la', 'los', 'las', 'un', 'de', 'del', 'al', 'a', 'y', 'o', 'en', 'con', 'por', 'que', 'mi', 'tu', 'su', 'me', 'te', 'se', 'lo', 'le', 'nos']);
  const XH = new Set(['méxico', 'mexico', 'mexicano', 'mexicana', 'oaxaca', 'texas']);
  const isV = c => c !== undefined && VOW.includes(c);
  const soft = c => c === 'e' || c === 'i' || c === 'é' || c === 'í';

  function tokenize(word, f) {
    const ch = [...word];
    const out = [];
    const C = s => out.push({ t: 'C', s });
    const V = (v, acc) => out.push({ t: 'V', v, acc: !!acc });
    for (let i = 0; i < ch.length; i++) {
      const c = ch[i], n = ch[i + 1], n2 = ch[i + 2];
      if (isV(c)) { V(ACC[c] || c, c !== 'ü' && !!ACC[c]); continue; }
      switch (c) {
        case 'c':
          if (n === 'h') { C('ch'); i++; }
          else if (soft(n)) C('s');
          else C('k');
          break;
        case 'q':
          C('k');
          if (n === 'u') { if (f.qu) V('u'); i++; }
          break;
        case 'g':
          if (n === 'u' && soft(n2)) { C('g'); i++; }
          else if (soft(n)) C(f.gsoft ? 'j' : 'h');
          else C('g');
          break;
        case 'h': if (f.h) C('h'); break;
        case 'j': C(f.j ? 'j' : 'h'); break;
        case 'l':
          if (n === 'l') { C(f.ll ? 'l' : 'y'); i++; } else C('l');
          break;
        case 'ñ': C(f.ny ? 'n' : 'ny'); break;
        case 'r':
          if (n === 'r') { C('rr'); i++; } else C(i === 0 ? 'rr' : 'r');
          break;
        case 'v': C(f.v ? 'v' : 'b'); break;
        case 'z': C(f.z ? 'z' : 's'); break;
        case 'x':
          if (XH.has(word)) C('h');
          else if (i === 0) C('s');
          else { C('k'); C('s'); }
          break;
        case 'y':
          if (!isV(n)) V('i'); else C('y');
          break;
        default:
          if ('bdfkmnpstw'.includes(c)) C(c);
      }
    }
    return out;
  }

  const weak = v => (v.v === 'i' || v.v === 'u') && !v.acc;

  function segment(tokens) {
    // -> [{cons:[..]}, {nuc:[..]}, ...] alternating, starting and ending with cons groups
    const segs = [{ cons: [] }];
    let i = 0;
    while (i < tokens.length) {
      const t = tokens[i];
      if (t.t === 'C') { segs[segs.length - 1].cons.push(t.s); i++; continue; }
      const nuc = [t]; let peak = !weak(t); let closed = false; i++;
      while (i < tokens.length && tokens[i].t === 'V' && !closed) {
        const w = tokens[i], after = tokens[i + 1];
        if (!peak) { nuc.push(w); peak = true; i++; }
        else if (weak(w) && !(after && after.t === 'V' && !weak(after))) { nuc.push(w); closed = true; i++; }
        else break;
      }
      segs.push({ nuc });
      segs.push({ cons: [] });
    }
    return segs;
  }

  const CL1 = new Set(['p', 'b', 'v', 'f', 'k', 'g', 't', 'd']);
  const isCluster = (a, b) => CL1.has(a) && (b === 'r' || (b === 'l' && a !== 'd'));

  function syllabify(segs) {
    const nucs = segs.filter(s => s.nuc);
    if (!nucs.length) return [];
    const syl = nucs.map(n => ({ on: [], nuc: n.nuc, co: [] }));
    let k = -1;
    for (let i = 0; i < segs.length; i++) {
      const s = segs[i];
      if (s.nuc) { k++; continue; }
      const c = s.cons;
      if (k === -1) { syl[0].on.push(...c); continue; }
      if (k === syl.length - 1) { syl[k].co.push(...c); continue; }
      let cut; // how many stay with the previous syllable
      if (c.length <= 1) cut = 0;
      else if (c.length === 2) cut = isCluster(c[0], c[1]) ? 0 : 1;
      else if (c.length === 3) cut = isCluster(c[1], c[2]) ? 1 : 2;
      else cut = c.length - 2;
      syl[k].co.push(...c.slice(0, cut));
      syl[k + 1].on.push(...c.slice(cut));
    }
    return syl;
  }

  const SINGLE = { a: 'ah', e: 'eh', i: 'ee', o: 'oh', u: 'oo' };
  const DIPH = {
    ei: 'ay', oi: 'oy', au: 'ow', eu: 'eh-oo', ou: 'oh',
    ia: 'yah', ie: 'yeh', io: 'yoh', iu: 'yoo', ua: 'wah', ue: 'weh', ui: 'wee', uo: 'woh',
    uei: 'way', iei: 'yay', ioi: 'yoy', uau: 'wow'
  };

  function renderSyl(s, f, pos) {
    const key = s.nuc.map(v => v.v).join('');
    const on = s.on.slice();
    let core;
    const bare = on.length === 0;
    if (key === 'ai') core = bare ? 'eye' : 'ye';
    else if (key === 'uai') core = 'wye';
    else if (key === 'iai') core = 'yye';
    else if (key.length === 1) {
      core = SINGLE[key];
      if (f.eAy && key === 'e' && pos.last && !s.co.length && pos.count > 1) core = 'ay';
      if (f.uYoo && key === 'u' && pos.first) core = 'yoo';
      if (f.iEye && key === 'i' && pos.stressed) core = bare ? 'eye' : 'ye';
      if (f.aAy && key === 'a' && pos.stressed) core = 'ay';
    } else core = DIPH[key] || s.nuc.map(v => SINGLE[v.v]).join('');
    const first = s.nuc[0].v;
    let o = on.map((c, i) => (c === 'g' && i === on.length - 1 && (first === 'e' || first === 'i')) ? 'gh' : c).join('');
    return o + core + s.co.join('');
  }

  function word(raw, f, lowerOnly) {
    const w = raw.toLowerCase().replace(/[^a-záéíóúüñ]/g, '');
    if (!w) return null;
    const syl = syllabify(segment(tokenize(w, f)));
    if (!syl.length) return null;
    let st = syl.findIndex(s => s.nuc.some(v => v.acc));
    if (st < 0) st = (/[aeiouns]$/.test(w) && syl.length > 1) ? syl.length - 2 : syl.length - 1;
    const natural = st;
    if (f.shift && syl.length > 1) st = (st + f.shift + syl.length) % syl.length;
    const parts = syl.map((s, i) => {
      const txt = renderSyl(s, f, { first: i === 0, last: i === syl.length - 1, count: syl.length, stressed: i === st });
      const stressed = i === st && !lowerOnly;
      return { t: stressed ? txt.toUpperCase() : txt, stress: stressed };
    });
    return { w: raw, syl: parts, natural, hasAccent: /[áéíóú]/.test(w), ending: w.slice(-1), count: syl.length };
  }

  function sound(text, flags) {
    const f = flags || {};
    const raws = String(text).split(/[\s/]+/).map(x => x.replace(/[¿?¡!.,;:"()…]/g, '')).filter(Boolean);
    const multi = raws.length > 1;
    let longest = -1, li = -1;
    raws.forEach((r, i) => { if (r.length > longest) { longest = r.length; li = i; } });
    const words = [];
    raws.forEach((r, i) => {
      const low = r.toLowerCase();
      const wf = (f.shift && i !== li) ? Object.assign({}, f, { shift: 0 }) : f;
      const res = word(r, wf, multi && FUNC.has(low));
      if (res) words.push(res);
    });
    return { words, text: words.map(w => w.syl.map(s => s.t).join('-')).join(' ') };
  }

  const WHY = {
    h: 'The H is always silent in Spanish.',
    j: 'J sounds like an English H.',
    gsoft: 'G before E or I sounds like an English H.',
    ll: 'LL sounds like an English Y.',
    ny: 'Ñ sounds like NY, as in canyon.',
    qu: 'QU sounds like K. The U stays silent.',
    z: 'In Latin America, Z sounds like S.',
    v: 'V sounds like a soft B.',
    eAy: 'E is always a short "eh". It never turns into "ay" or "ee".',
    uYoo: 'U is always "oo". It never starts with a Y sound.',
    iEye: 'I always sounds like "ee".',
    aAy: 'A always sounds like "ah".'
  };

  function stressWhy(text) {
    const s = sound(text);
    let best = null;
    s.words.forEach(w => { if (!best || w.w.length > best.w.length) best = w; });
    if (!best) return '';
    const syl = best.syl.find(x => x.stress);
    const where = syl ? syl.t : '';
    if (best.hasAccent) return 'Stress lands on ' + where + '. The accent mark tells you where.';
    if (/[aeiouns]/.test(best.ending)) return 'Stress lands on ' + where + '. Words ending in a vowel, N or S stress the next-to-last syllable.';
    return 'Stress lands on ' + where + '. Words ending in other consonants stress the last syllable.';
  }

  function traps(text) {
    const right = sound(text).text;
    const seen = new Set([right]);
    const out = [];
    const tryFlag = (flags, why) => {
      const t = sound(text, flags).text;
      if (!seen.has(t)) { seen.add(t); out.push({ ph: t, why }); }
    };
    ['h', 'j', 'gsoft', 'll', 'ny', 'qu', 'z', 'v'].forEach(k => tryFlag({ [k]: true }, WHY[k]));
    tryFlag({ shift: -1 }, stressWhy(text));
    ['eAy', 'uYoo', 'iEye', 'aAy'].forEach(k => tryFlag({ [k]: true }, WHY[k]));
    tryFlag({ shift: 1 }, stressWhy(text));
    return out;
  }

  return { sound, traps, stressWhy };
})();


/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const STANDALONE = !(window.claude && window.claude.use); // true when installed from the web, outside Claude
function h(tag, a, ...kids) {
  const e = document.createElement(tag);

    const v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v; // static icons only
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

}
function add(el, ...kids) {

}

const norm = s => plain(s).normalize('NFD').replace(/[̀-ͯ]/g, '');

/* ---------- course ---------- */
const COURSE = [
  ['saludos', 'Saludos', 'Greetings', [

    if (!db || !user) return;

function weakItems() {
  const seen = Object.keys(S.p.words).filter(id => ITEM[id]);
  const weak = seen.filter(id => { const w = S.p.words[id]; return !w.ok || w.w >= w.c; });
  const rest = shuffle(seen.filter(id => !weak.includes(id)));
  return { weak: weak.length, items: shuffle(weak).concat(rest).slice(0, 8).map(id => ITEM[id]) };
}
function renderReview() {
  const v = $('#v-review'), wk = weakItems(), total = S.sessions.reduce((n, s) => n + s.items.length, 0);
  const list = h('div', { class: 'hist', id: 'hist' });
  const chip = (id, label) => h('button', { class: 'chip', type: 'button', 'aria-pressed': String(RV.filter === id), text: label, onclick: () => { RV.filter = id; renderReview(); } });
  const picker = h('input', { id: 'restoreFile', type: 'file', accept: '.txt,.json,text/plain,application/json', hidden: true, 'aria-label': 'Backup file', onchange: () => restore(picker.files[0]) });
  const search = h('input', { class: 'field', id: 'histSearch', type: 'search', value: RV.q, placeholder: 'Search your answers', 'aria-label': 'Search your answers', oninput: () => { RV.q = search.value; drawHist(list); } });
  fill(v, 
    h('div', { style: 'display:grid;gap:6px' }, h('h1', { style: 'font-size:28px', text: 'Repaso' }), phon('repaso'), h('div', { class: 'en', text: 'Every question you answer is kept here.' })),
    h('div', { class: 'sync' + (syncMode === 'account' ? '' : ' local') }, h('i'), syncMode === 'account'
      ? total + ' answers and ' + S.qa.length + ' tutor replies saved to your account, with a copy on this device.'
      : STANDALONE ? total + ' answers saved on this device. They stay here with no connection.'
      : total + ' answers and ' + S.qa.length + ' tutor replies saved on this device.'),
    h('button', { class: 'btn primary', type: 'button', disabled: !wk.items.length, text: !wk.items.length ? 'Finish a lesson to unlock practice' : wk.weak ? 'Practice ' + wk.weak + ' weak word' + (wk.weak > 1 ? 's' : '') : 'Practice words you know',
      onclick: () => openLesson({ id: 'repaso', kind: 'practice', label: 'Repaso', unit: null, items: wk.items, sents: [], noProgress: true }) }),
    STANDALONE && h('div', { class: 'row2' },
      h('button', { class: 'btn quiet sm', type: 'button', text: 'Back up', disabled: !total, onclick: backup }),
      h('button', { class: 'btn quiet sm', type: 'button', text: 'Restore', onclick: () => picker.click() }), picker),
    RV.msg && h('p', { class: 'note', role: 'status', text: RV.msg }),
    h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter' }, chip('all', 'All answers'), chip('missed', 'Missed'), !STANDALONE && chip('tutor', 'Tutor')),
    search, list);
  drawHist(list);
}
function drawHist(list) {
  const q = norm(RV.q), frag = [];
  const dayLabel = t => new Date(t).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  if (RV.filter === 'tutor') {
    S.qa.slice().reverse().filter(x => !q || norm(x.q + ' ' + x.a).includes(q)).slice(0, 60).forEach(x => {
      const a = h('div', { class: 'msg orb-says' }); rich(a, x.a);
      frag.push(h('div', { class: 'day', text: dayLabel(x.t) }), h('div', { class: 'thread', style: 'margin:8px 0 6px' }, h('div', { class: 'msg me', text: x.q }), a));
    });
    if (!frag.length) frag.push(h('p', { class: 'empty', text: q ? 'No tutor replies match that search.' : 'Nothing saved yet. Ask the tutor a question and the answer is kept here for later.' }));
  } else {
    let lastDay = '', n = 0;
    for (const s of S.sessions.slice().reverse()) {
      for (const it of s.items.slice().reverse()) {
        if (n >= 150) break;
        if (RV.filter === 'missed' && it.ok) continue;
        if (q && !norm([it.es, it.en, it.a, it.q].join(' ')).includes(q)) continue;
        const d = dayLabel(s.t);
        if (d !== lastDay) { frag.push(h('div', { class: 'day', text: d })); lastDay = d; }
        const b = phon(it.es, 'sm');
        frag.push(h('button', { class: 'hrow', type: 'button', onclick: () => speak(it.es, b) },
          h('span', { class: 'dot' + (it.ok ? '' : ' bad'), role: 'img', 'aria-label': it.ok ? 'Correct' : 'Missed' }),
          h('span', { class: 'body' }, h('span', { class: 'k', text: KLAB[it.k] || '' }), h('b', { text: it.es }), b, h('span', { class: 'en', style: 'font-size:14px', text: it.en }),
            !it.ok && h('span', { class: 'you', text: 'You answered: ' + (it.a || 'nothing') }))));
        n++;
      }
    }
    if (!n) frag.push(h('p', { class: 'empty', text: q ? 'Nothing matches that search.' : RV.filter === 'missed' ? 'No missed answers. Finish a lesson and anything you get wrong shows up here.' : 'Nothing saved yet. Finish a lesson and each question, your answer and the right answer are kept here.' }));
  }
  list.replaceChildren(...frag);
}

/* ---------- ask the tutor ---------- */
const AK = {};
let AI = null, aiReady = Promise.resolve(null);
const TUTOR = 'You are Órbita, a warm, exacting Spanish teacher with 50 years in the classroom. Your student is an adult English speaker and a beginner, learning Latin American Spanish. ' +
  'Answer in plain English in under 130 words. Wrap every Spanish word or phrase in double square brackets, like [[buenos días]], and put its English meaning in parentheses right after. ' +
  'The app shows the pronunciation for anything in double brackets, so never write your own pronunciation guides. No markdown, no headings, no bullet symbols. ' +
  'Explain the why behind a rule in one sentence. End with one short thing for the student to say out loud.';
function rich(el, text) {
  el.replaceChildren();
  String(text).replace(/\[\[[^\]]*$/, '').split(/\n+/).forEach(par => {
    if (!par.trim()) return;
    const p = h('p');
    par.split(/(\[\[.+?\]\])/).forEach(seg => {
      const m = seg.match(/^\[\[(.+?)\]\]$/);
      if (m) { const es = m[1].trim(); p.append(h('button', { class: 'es-chip', type: 'button', 'aria-label': 'Hear ' + es, onclick: () => speak(es) }, h('b', { text: es }), h('span', { text: PH.sound(es).text }))); }
      else if (seg) p.append(seg.replace(/\*\*/g, ''));
    });
    el.append(p);
  });
}
function buildAsk() {
  const v = $('#v-ask'), cv = h('canvas', { class: 'orb' });
  AK.note = h('p', { class: 'note', hidden: true });
  AK.thread = h('div', { class: 'thread' });
  AK.input = h('input', { class: 'field', id: 'askInput', type: 'text', autocomplete: 'off', placeholder: 'Ask about a word, a rule, a phrase', 'aria-label': 'Your question' });
  AK.send = h('button', { class: 'say', type: 'submit', 'aria-label': 'Send question', html: IC.send });
  AK.form = h('form', { class: 'ask-bar', onsubmit: e => { e.preventDefault(); const q = AK.input.value.trim(); if (q) { AK.input.value = ''; ask(q); } } }, AK.input, AK.send);
  AK.sugg = h('div', { class: 'chips' }, ['When do I use tú and when usted?', 'How do I roll my R?', 'How do I order food politely?', 'Ser or estar: what is the difference?'].map(q => h('button', { class: 'chip', type: 'button', text: q, onclick: () => ask(q) })));
  add(v, 
    h('div', { class: 'ask-head' }, h('div', { class: 'ask-orb', 'aria-hidden': 'true' }, cv),
      h('div', { style: 'display:grid;gap:6px;min-width:0' }, h('h1', { text: 'Pregúntame' }), phon('pregúntame'), h('div', { class: 'en', text: 'Ask me anything about Spanish.' }))),
    AK.note, AK.sugg, AK.thread, AK.form);
  AK.orb = new Orb(cv);
  S.qa.slice(-4).forEach(x => addExchange(x.q, x.a));
}
function addExchange(q, a) {
  const bubble = h('div', { class: 'msg orb-says' });
  if (a == null) bubble.append(h('span', { class: 'dots', role: 'img', 'aria-label': 'Thinking' }, h('i'), h('i'), h('i'))); else rich(bubble, a);
  AK.thread.append(h('div', { class: 'msg me', text: q }), bubble);
  return bubble;
}
function askNote(msg) { AK.note.textContent = msg; AK.note.hidden = !msg; }
let asking = false;
async function ask(q) {
  if (asking) return;
  asking = true; AK.send.disabled = true;
  const bubble = addExchange(q, null);
  bubble.scrollIntoView({ block: 'nearest', behavior: RM ? 'auto' : 'smooth' });
  AK.orb.set('thinking');
  try {
    if (!AI) await aiReady;
    if (!AI) throw { code: 'offline' };
    const weak = weakItems().items.slice(0, 5).map(i => i.es).join(', ');
    const hist = S.qa.slice(-3).flatMap(x => [{ role: 'user', content: x.q }, { role: 'assistant', content: x.a }]);
    const res = await AI(hist.concat([{ role: 'user', content: TUTOR + '\n\nStudent progress: ' + lessonsDone() + ' of ' + LESSONS.length + ' beginner lessons done' + (weak ? '; currently practicing: ' + weak : '') + '.\n\nStudent question: ' + q }]),
      { cache: false, onText: ({ text }) => { if (text) rich(bubble, text); } });
    const text = (res && res.text || '').trim();
    if (!text) throw { code: 'empty' };
    rich(bubble, text); askNote('');
    const entry = { id: 'q_' + Date.now().toString(36), t: Date.now(), q, a: text };
    S.qa.push(entry); markDirty(entry.id); save(); flush();
    AK.orb.set('correct', 900);
  } catch (e) {
    const code = e && e.code;
    bubble.replaceChildren(code === 'rate_limited' ? 'Too many questions at once. Wait a minute, then ask again.'
      : code === 'offline' || code === 'not_granted' ? 'I can only answer new questions with an internet connection and your Claude account. Your saved answers are in Review, and Sounds works without a connection.'
      : 'That answer did not come through. Check your connection and ask again.');
    AK.orb.set('wrong', 900);
  }
  asking = false; AK.send.disabled = false;
}

/* ---------- boot ---------- */
function refreshAll(popped) {
  refreshHeader(popped); refreshLearn();
  if (!$('#v-review').hidden) renderReview();
}
document.documentElement.style.setProperty('--tabs', TABS.length);
document.querySelectorAll('[data-tab]').forEach(b => {
  const t = TABS.find(x => x[0] === b.dataset.tab);
  if (!t) return b.remove();
  b.innerHTML = IC[t[0]]; b.append(h('span', { text: t[1] }));
  b.addEventListener('click', () => { if (location.hash !== '#' + t[0]) location.hash = t[0]; else route(); });
});
$('#muteBtn').addEventListener('click', () => { S.mute = !S.mute; save(); refreshHeader(); });
buildLearn(); buildSounds(); if (!STANDALONE) buildAsk(); refreshAll(); route();
window.addEventListener('hashchange', route);
if (!hasAudio()) document.body.classList.add('no-audio');
try { if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } } catch (e) {}
if (!RM) requestAnimationFrame(frame);
if (STANDALONE && /^https?:$/.test(location.protocol)) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
}
if (window.claude && window.claude.use) {
  window.claude.use('tts').then(t => { if (t) { Voice.tts = t; document.body.classList.remove('no-audio'); } }).catch(() => {});
  aiReady = window.claude.use('sample').then(s => (AI = s || null)).catch(() => null);
  initCloud();
}
</script>
